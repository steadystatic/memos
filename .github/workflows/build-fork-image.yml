name: Build fork image

on:
  push:
    branches: [lexend]
  workflow_dispatch:

env:
  # Must match upstream's YY.MM.N format; bump when merging a new upstream release.
  MEMOS_VERSION: 26.11.1

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=lexend
            type=raw,value=${{ env.MEMOS_VERSION }}-lexend
            type=sha,prefix=lexend-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fork
          target: monolithic
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.MEMOS_VERSION }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
